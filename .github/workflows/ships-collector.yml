name: Ships Collector

on:
  schedule:
    # Körs var 10:e minut (GitHub Actions gratiskvot räcker gott och väl)
    - cron: '*/10 * * * *'
  # Tillåter manuell start under fliken "Actions" på GitHub
  workflow_dispatch:
    inputs:
      bbox:
        description: "Test: another box, JSON [[[lat,lon],[lat,lon]]] (empty = Sundsvall)"
        required: false
      seconds:
        description: "Listen this long (s, default 240)"
        required: false
      dry_run:
        description: "Test: 1 = only count, send nothing"
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run collector script
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SHIPS_INGEST_SECRET: ${{ secrets.SHIPS_INGEST_SECRET }}
          SHIPS_APP_URL: "https://sundsvall-transit-pulse.lovable.app"
          AIS_BBOX: ${{ github.event.inputs.bbox }}
          AIS_DRY_RUN: ${{ github.event.inputs.dry_run }}
          AIS_SECONDS: ${{ github.event.inputs.seconds }}
        run: bun scripts/ships-collector.ts
